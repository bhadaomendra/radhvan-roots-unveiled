name: Deploy to domainz (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bunx vite build --config vite.pages.config.ts

      - name: Add SPA fallback and clean URLs (.htaccess)
        run: |
          cp dist/index.html dist/404.html || true
          rm -f dist/CNAME
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Enforce Primary Domain (radhvanorigins.com) and HTTPS
            RewriteCond %{HTTP_HOST} !^radhvanorigins\.com$ [NC,OR]
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://radhvanorigins.com/$1 [L,R=301]

            RewriteRule ^index\.html$ - [L]

            # Clean URLs: serve .html file when a matching one exists
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.*)$ $1.html [L]

            # SPA fallback for everything else
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          # Cache-busting strategy for static HTML files
          <IfModule mod_expires.c>
            ExpiresActive On
            # Set a very short expiry for HTML files to ensure updates are seen
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>

          <IfModule mod_headers.c>
            # Prevent intermediate proxies and browsers from caching HTML heavily
            <FilesMatch "\.(html|htm|xml|json)$">
              Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
            # Allow long-term caching for hashed assets (JS/CSS/Images)
            <FilesMatch "\.(js|css|jpg|jpeg|png|gif|ico|svg|woff|woff2)$">
              Header set Cache-Control "max-age=31536000, public"
            </FilesMatch>
          </IfModule>
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
